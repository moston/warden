{
  "apiVersion": 1,
  "groups": [
    {
      "orgId": 1,
      "name": "warden-observability",
      "folder": "Warden Alerts",
      "interval": "1m",
      "rules": [
        {
          "uid": "warden-apm-p95",
          "title": "APM: p95 latencja endpointow > 3s",
          "condition": "C",
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "histogram_quantile(0.95, sum by (le) (rate(traces_spanmetrics_latency_bucket{span_kind=\"SPAN_KIND_SERVER\"}[5m])))",
                "instant": true,
                "intervalMs": 1000,
                "maxDataPoints": 43200,
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                }
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        3
                      ]
                    }
                  }
                ],
                "datasource": {
                  "type": "__expr__",
                  "uid": "__expr__"
                }
              }
            }
          ],
          "noDataState": "OK",
          "execErrState": "OK",
          "for": "5m",
          "labels": {
            "severity": "warning"
          },
          "annotations": {
            "summary": "p95 latencja SERVER (RED) > 3s"
          }
        },
        {
          "uid": "warden-apm-errrate",
          "title": "APM: error rate serwisu > 0.5%",
          "condition": "C",
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "100 * sum by (service_name) (rate(traces_spanmetrics_calls_total{status_code=\"STATUS_CODE_ERROR\"}[5m])) / clamp_min(sum by (service_name) (rate(traces_spanmetrics_calls_total[5m])), 1)",
                "instant": true,
                "intervalMs": 1000,
                "maxDataPoints": 43200,
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                }
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0.5
                      ]
                    }
                  }
                ],
                "datasource": {
                  "type": "__expr__",
                  "uid": "__expr__"
                }
              }
            }
          ],
          "noDataState": "OK",
          "execErrState": "OK",
          "for": "5m",
          "labels": {
            "severity": "warning"
          },
          "annotations": {
            "summary": "error rate serwisu (RED) > 0.5%"
          }
        },
        {
          "uid": "warden-redis-hitrate",
          "title": "Redis: hit rate < 85%",
          "condition": "C",
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "(100 * sum by (env_name) (rate(redis_keyspace_hits_total[5m])) / (sum by (env_name) (rate(redis_keyspace_hits_total[5m])) + sum by (env_name) (rate(redis_keyspace_misses_total[5m])))) and (sum by (env_name) (rate(redis_commands_processed_total[5m])) > 1)",
                "instant": true,
                "intervalMs": 1000,
                "maxDataPoints": 43200,
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                }
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "lt",
                      "params": [
                        85
                      ]
                    }
                  }
                ],
                "datasource": {
                  "type": "__expr__",
                  "uid": "__expr__"
                }
              }
            }
          ],
          "noDataState": "OK",
          "execErrState": "OK",
          "for": "10m",
          "labels": {
            "severity": "warning"
          },
          "annotations": {
            "summary": "Redis hit rate < 85% (pod obciazeniem)"
          }
        },
        {
          "uid": "warden-fpm-maxchildren",
          "title": "PHP-FPM: osiagnieto max_children",
          "condition": "C",
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "max by (env_name) (phpfpm_max_children_reached)",
                "instant": true,
                "intervalMs": 1000,
                "maxDataPoints": 43200,
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                }
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0
                      ]
                    }
                  }
                ],
                "datasource": {
                  "type": "__expr__",
                  "uid": "__expr__"
                }
              }
            }
          ],
          "noDataState": "OK",
          "execErrState": "OK",
          "for": "1m",
          "labels": {
            "severity": "warning"
          },
          "annotations": {
            "summary": "PHP-FPM osiagnal pm.max_children (pool wyczerpany)"
          }
        },
        {
          "uid": "warden-fpm-queue",
          "title": "PHP-FPM: listen queue > 10",
          "condition": "C",
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "max by (env_name) (phpfpm_listen_queue)",
                "instant": true,
                "intervalMs": 1000,
                "maxDataPoints": 43200,
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                }
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        10
                      ]
                    }
                  }
                ],
                "datasource": {
                  "type": "__expr__",
                  "uid": "__expr__"
                }
              }
            }
          ],
          "noDataState": "OK",
          "execErrState": "OK",
          "for": "5m",
          "labels": {
            "severity": "warning"
          },
          "annotations": {
            "summary": "PHP-FPM listen queue > 10 (backlog polaczen)"
          }
        },
        {
          "uid": "warden-es-heap",
          "title": "Elasticsearch: heap > 90%",
          "condition": "C",
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "100 * max by (env_name) (elasticsearch_jvm_memory_used_bytes{area=\"heap\"}) / clamp_min(max by (env_name) (elasticsearch_jvm_memory_max_bytes{area=\"heap\"}), 1)",
                "instant": true,
                "intervalMs": 1000,
                "maxDataPoints": 43200,
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                }
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        90
                      ]
                    }
                  }
                ],
                "datasource": {
                  "type": "__expr__",
                  "uid": "__expr__"
                }
              }
            }
          ],
          "noDataState": "OK",
          "execErrState": "OK",
          "for": "5m",
          "labels": {
            "severity": "critical"
          },
          "annotations": {
            "summary": "Elasticsearch JVM heap > 90%"
          }
        },
        {
          "uid": "warden-target-down",
          "title": "Exporter/target down",
          "condition": "C",
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "up{job=\"warden-containers\"}",
                "instant": true,
                "intervalMs": 1000,
                "maxDataPoints": 43200,
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                }
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "lt",
                      "params": [
                        1
                      ]
                    }
                  }
                ],
                "datasource": {
                  "type": "__expr__",
                  "uid": "__expr__"
                }
              }
            }
          ],
          "noDataState": "OK",
          "execErrState": "OK",
          "for": "3m",
          "labels": {
            "severity": "critical"
          },
          "annotations": {
            "summary": "Exporter infry (target warden-containers) jest down"
          }
        }
      ]
    }
  ]
}