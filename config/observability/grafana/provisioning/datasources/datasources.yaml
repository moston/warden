apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      httpMethod: POST
      # metryka → trace: punkt na wykresie latencji linkuje do konkretnego trace'a
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # log → trace: wyciaga trace_id z linii logu i tworzy link do Tempo
      derivedFields:
        - name: trace_id
          matcherRegex: '"trace_id":"(\w+)"'
          url: '${__value.raw}'
          datasourceUid: tempo

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      # trace → log: klik w span otwiera Loki przefiltrowane po trace_id
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true
        tags:
          - key: service.name
            value: service
      # trace → metryka (RED z span_metrics)
      tracesToMetrics:
        datasourceUid: prometheus
      # automatyczna mapa serwisow z traces_service_graph_*
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
