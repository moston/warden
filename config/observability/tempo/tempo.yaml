# Tempo 3.0 — tryb single-binary (-target=all), bez Kafki.
# W 3.0 lokalny ingest distributor -> live-store -> metrics-generator dziala
# wewnetrznie bez kolejki (PR #6729). Zniknely bloki `ingester:` i `compactor:`
# znane z 2.x; kompakcja/retencja obsluguje wewnetrzny backend_scheduler
# (domyslny block_retention = 336h wystarcza lokalnie).
stream_over_http_enabled: true

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

# Serce APM: z kazdego spana generuje metryki RED (span_metrics) oraz
# graf zaleznosci (service_graphs) i remote-write'uje je do Prometheusa.
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  processor:
    span_metrics:
      dimensions: [service.name, deployment.environment, http.route]
    service_graphs:
      dimensions: [service.name, deployment.environment]

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# Wlacza generowanie metryk domyslnie dla wszystkich tenantow.
overrides:
  defaults:
    metrics_generator:
      processors: [span-metrics, service-graphs]
      generate_native_histograms: both

usage_report:
  reporting_enabled: false
