services:
  # ── Grafana — jedno UI: metryki + logi + traces + APM ──────────────────
  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-13.1.0}
    container_name: grafana
    networks: [warden]
    restart: ${WARDEN_RESTART_POLICY:-always}
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_AUTH_BASIC_ENABLED=false
      - GF_SERVER_ROOT_URL=https://grafana.${WARDEN_SERVICE_DOMAIN:-warden.test}
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
      # bundled pluginy sa juz w obrazie; wylaczamy auto-preinstall
      # (probuje aktualizowac je w read-only warstwie -> permission denied)
      - GF_PLUGINS_PREINSTALL_DISABLED=true
    volumes:
      - grafana-data:/var/lib/grafana
      # montujemy tylko nasze podkatalogi provisioningu — plugins/alerting itd.
      # zostaja domyslne z obrazu (inaczej Grafana zglasza "directory not found")
      - ./etc/observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./etc/observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.grafana.tls=true
      - traefik.http.routers.grafana.rule=Host(`grafana.${WARDEN_SERVICE_DOMAIN:-warden.test}`)
      - traefik.http.services.grafana.loadbalancer.server.port=3000
    depends_on: [prometheus, loki, tempo]

  # ── Prometheus — metryki infra + backend span_metrics/service_graph ─────
  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v3.13.1}
    container_name: prometheus
    user: root
    networks: [warden]
    restart: ${WARDEN_RESTART_POLICY:-always}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
      - --enable-feature=native-histograms
    volumes:
      - prometheus-data:/prometheus
      - ./etc/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # ── Loki — logi aplikacji i kontenerow ─────────────────────────────────
  loki:
    image: grafana/loki:${LOKI_VERSION:-3.7.3}
    container_name: loki
    networks: [warden]
    restart: ${WARDEN_RESTART_POLICY:-always}
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - loki-data:/loki
      - ./etc/observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro

  # ── Tempo — traces + metrics-generator (RED + service graph) ───────────
  tempo:
    image: grafana/tempo:${TEMPO_VERSION:-3.0.2}
    container_name: tempo
    networks: [warden]
    restart: ${WARDEN_RESTART_POLICY:-always}
    command: -target=all -config.file=/etc/tempo/tempo.yaml
    volumes:
      - tempo-data:/var/tempo
      - ./etc/observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro

  # ── Grafana Alloy — jeden kolektor: OTLP (traces) + logi kontenerow ────
  alloy:
    image: grafana/alloy:${ALLOY_VERSION:-v1.17.1}
    container_name: alloy
    user: root
    networks: [warden]
    restart: ${WARDEN_RESTART_POLICY:-always}
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "4317:4317"   # OTLP gRPC — aplikacje push'uja traces
      - "4318:4318"   # OTLP HTTP
    volumes:
      - alloy-data:/var/lib/alloy/data
      - ./etc/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.alloy.tls=true
      - traefik.http.routers.alloy.rule=Host(`alloy.${WARDEN_SERVICE_DOMAIN:-warden.test}`)
      - traefik.http.services.alloy.loadbalancer.server.port=12345
    depends_on: [tempo, loki]

  # ── Percona PMM — Query Analytics dla MySQL ────────────────────────────
  # Serwer stoi globalnie; instancje MySQL kazdego srodowiska rejestruje sie
  # osobno (pmm-admin add mysql / Faza 4 integracji z b/dev-env). Do czasu
  # rejestracji QAN nie pokazuje danych. Domyslny login: admin / admin
  # (PMM wymusi zmiane hasla przy pierwszym logowaniu).
  pmm:
    image: percona/pmm-server:${PMM_VERSION:-3.8.1}
    container_name: pmm
    # PMM Server jest wydawany tylko dla amd64; na Apple Silicon idzie pod emulacja
    platform: linux/amd64
    networks: [warden]
    restart: ${WARDEN_RESTART_POLICY:-always}
    volumes:
      - pmm-data:/srv
    labels:
      - traefik.enable=true
      - traefik.http.routers.pmm.tls=true
      - traefik.http.routers.pmm.rule=Host(`pmm.${WARDEN_SERVICE_DOMAIN:-warden.test}`)
      - traefik.http.services.pmm.loadbalancer.server.port=8080

  # ── k6 — testy obciazeniowe (uruchamiane ad-hoc) ───────────────────────
  # profiles: ["k6"] => NIE startuje z `warden svc up`; odpalasz na zadanie:
  #   docker compose -p warden --project-directory ~/.warden \
  #     -f <repo>/docker/docker-compose.observability.yml \
  #     run --rm -e BASE_URL=https://app.master.test -e ENV_NAME=master \
  #     k6 run -o experimental-prometheus-rw /scripts/example.js
  # Wyniki trafiaja do Prometheusa (remote-write) i sa widoczne w Grafanie.
  k6:
    image: grafana/k6:${K6_VERSION:-2.1.0}
    container_name: k6
    profiles: ["k6"]
    networks: [warden]
    environment:
      - K6_PROMETHEUS_RW_SERVER_URL=http://prometheus:9090/api/v1/write
      - K6_PROMETHEUS_RW_TREND_STATS=p(95),p(99),min,max,avg
      - K6_FEATURES=native-histograms
    volumes:
      - ./etc/observability/k6:/scripts:ro

volumes:
  grafana-data:
  prometheus-data:
  loki-data:
  tempo-data:
  alloy-data:
  pmm-data:

networks:
  warden:
    external: true
